<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập — VòngMáy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['Space Grotesk', 'sans-serif'], sans: ['Inter', 'sans-serif'] },
      colors: {
        brand: { 50:'#eef3ff',100:'#dce6ff',200:'#b8ccff',300:'#8aa9ff',400:'#5c86ff',500:'#3868ff',600:'#1f5eff',700:'#1747c9',800:'#143a9e',900:'#122f7d' },
        ink: { 50:'#f7f7fb',100:'#e9eaf0',200:'#d3d5e0',300:'#b0b3c4',500:'#5b5f6b',700:'#33353d',900:'#141414' },
      },
    }},
  };
</script>
<style>body{font-family:'Inter',sans-serif;background:#F7F7FB;} .font-display{font-family:'Space Grotesk',sans-serif;}</style>
</head>
<body class="min-h-screen text-ink-900">

<div id="site-nav"></div>

<main class="mx-auto flex max-w-md flex-col px-4 py-12 sm:px-6">
  <h1 class="mb-1 font-display text-2xl font-bold">Đăng nhập</h1>
  <p class="mb-6 text-ink-500">Chưa có tài khoản? <a href="/register.html" class="text-brand-600 underline">Đăng ký ngay</a></p>

  <form id="login-form" class="flex flex-col gap-4 rounded-2xl border border-ink-100 bg-white p-6">
    <div>
      <label class="mb-1 block text-sm font-medium">Email</label>
      <input id="email" type="email" required class="w-full rounded-xl border border-ink-200 px-4 py-2.5 outline-none focus:border-brand-500" />
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium">Mật khẩu</label>
      <input id="password" type="password" required class="w-full rounded-xl border border-ink-200 px-4 py-2.5 outline-none focus:border-brand-500" />
    </div>

    <p id="login-error" class="hidden text-sm font-medium text-red-500"></p>

    <button type="submit" id="submit-btn" class="mt-2 rounded-full bg-ink-900 py-3 font-medium text-white hover:bg-brand-600">Đăng nhập</button>
  </form>
</main>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/nav.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('hidden');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang đăng nhập...';

    try {
      const { token, user } = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
      });
      saveSession(token, user);
      window.location.href = user.role === 'admin' ? '/admin/dashboard.html' : '/index.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đăng nhập';
    }
  });
</script>
</body>
</html>
