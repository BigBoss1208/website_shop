<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard quản trị — VòngMáy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['Space Grotesk', 'sans-serif'], sans: ['Inter', 'sans-serif'] },
      colors: {
        brand: { 50:'#eef3ff',100:'#dce6ff',200:'#b8ccff',300:'#8aa9ff',400:'#5c86ff',500:'#3868ff',600:'#1f5eff',700:'#1747c9',800:'#143a9e',900:'#122f7d' },
        ink: { 50:'#f7f7fb',100:'#e9eaf0',200:'#d3d5e0',300:'#b0b3c4',500:'#5b5f6b',700:'#33353d',900:'#141414' },
      },
    }},
  };
</script>
<style>body{font-family:'Inter',sans-serif;background:#F7F7FB;} .font-display{font-family:'Space Grotesk',sans-serif;}</style>
</head>
<body class="min-h-screen text-ink-900">

<div id="site-nav"></div>

<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
    <h1 class="font-display text-2xl font-bold sm:text-3xl">Dashboard</h1>
    <nav class="flex gap-2 text-sm">
      <a href="/admin/dashboard.html" class="rounded-full bg-ink-900 px-4 py-2 text-white">Tổng quan</a>
      <a href="/admin/products.html" class="rounded-full border border-ink-200 px-4 py-2 hover:border-brand-400">Sản phẩm</a>
      <a href="/admin/orders.html" class="rounded-full border border-ink-200 px-4 py-2 hover:border-brand-400">Đơn hàng</a>
    </nav>
  </div>

  <div id="stats-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div class="h-28 animate-pulse rounded-2xl bg-ink-100"></div>
    <div class="h-28 animate-pulse rounded-2xl bg-ink-100"></div>
    <div class="h-28 animate-pulse rounded-2xl bg-ink-100"></div>
    <div class="h-28 animate-pulse rounded-2xl bg-ink-100"></div>
  </div>

  <div class="mt-8">
    <h2 class="mb-3 font-display text-lg font-bold">Đơn hàng gần đây</h2>
    <div class="overflow-x-auto rounded-2xl border border-ink-100 bg-white">
      <table class="w-full min-w-[600px] text-left text-sm">
        <thead class="border-b border-ink-100 text-ink-500">
          <tr><th class="px-4 py-3">Mã đơn</th><th class="px-4 py-3">Khách hàng</th><th class="px-4 py-3">Tổng tiền</th><th class="px-4 py-3">Trạng thái</th><th class="px-4 py-3">Ngày tạo</th></tr>
        </thead>
        <tbody id="recent-orders-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/nav.js"></script>
<script>
  if (requireAdmin()) loadDashboard();

  const STATUS_LABEL = {
    pending: { text: 'Chờ xử lý', color: 'bg-yellow-100 text-yellow-700' },
    processing: { text: 'Đang xử lý', color: 'bg-blue-100 text-blue-700' },
    completed: { text: 'Hoàn tất', color: 'bg-green-100 text-green-700' },
    cancelled: { text: 'Đã huỷ', color: 'bg-red-100 text-red-700' },
  };

  function statCard(label, value, accent = 'text-ink-900') {
    return `
      <div class="rounded-2xl border border-ink-100 bg-white p-5">
        <p class="text-sm text-ink-500">${label}</p>
        <p class="mt-2 font-display text-2xl font-bold ${accent}">${value}</p>
      </div>
    `;
  }

  async function loadDashboard() {
    try {
      // Lấy tối đa 100 đơn gần nhất để tính thống kê đơn giản (demo).
      const { data: orders } = await apiFetch('/admin/orders?limit=100');

      const totalRevenue = orders
        .filter((o) => o.status === 'completed')
        .reduce((sum, o) => sum + o.total_price, 0);
      const pendingCount = orders.filter((o) => o.status === 'pending').length;
      const processingCount = orders.filter((o) => o.status === 'processing').length;

      document.getElementById('stats-grid').innerHTML = [
        statCard('Doanh thu (đơn hoàn tất)', formatCurrency(totalRevenue), 'text-brand-600'),
        statCard('Tổng số đơn hàng', orders.length),
        statCard('Đơn chờ xử lý', pendingCount, 'text-yellow-600'),
        statCard('Đơn đang xử lý', processingCount, 'text-blue-600'),
      ].join('');

      document.getElementById('recent-orders-body').innerHTML = orders
        .slice(0, 10)
        .map((o) => {
          const status = STATUS_LABEL[o.status] ?? STATUS_LABEL.pending;
          return `
          <tr class="border-b border-ink-50 last:border-0">
            <td class="px-4 py-3 font-medium">#${o.id}</td>
            <td class="px-4 py-3">${escapeHtml(o.user_name)}<br/><span class="text-xs text-ink-500">${escapeHtml(o.user_email)}</span></td>
            <td class="px-4 py-3">${formatCurrency(o.total_price)}</td>
            <td class="px-4 py-3"><span class="rounded-full px-3 py-1 text-xs font-medium ${status.color}">${status.text}</span></td>
            <td class="px-4 py-3 text-ink-500">${new Date(o.created_at).toLocaleDateString('vi-VN')}</td>
          </tr>`;
        })
        .join('');
    } catch (err) {
      document.getElementById('stats-grid').innerHTML = `<p class="col-span-full py-8 text-center text-red-500">${err.message}</p>`;
    }
  }
</script>
</body>
</html>
