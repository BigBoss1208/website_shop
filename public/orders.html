<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đơn hàng của tôi — VòngMáy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['Space Grotesk', 'sans-serif'], sans: ['Inter', 'sans-serif'] },
      colors: {
        brand: { 50:'#eef3ff',100:'#dce6ff',200:'#b8ccff',300:'#8aa9ff',400:'#5c86ff',500:'#3868ff',600:'#1f5eff',700:'#1747c9',800:'#143a9e',900:'#122f7d' },
        ink: { 50:'#f7f7fb',100:'#e9eaf0',200:'#d3d5e0',300:'#b0b3c4',500:'#5b5f6b',700:'#33353d',900:'#141414' },
      },
    }},
  };
</script>
<style>body{font-family:'Inter',sans-serif;background:#F7F7FB;} .font-display{font-family:'Space Grotesk',sans-serif;}</style>
</head>
<body class="min-h-screen text-ink-900">

<div id="site-nav"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6">
  <h1 class="mb-6 font-display text-2xl font-bold sm:text-3xl">Đơn hàng của tôi</h1>
  <div id="orders-list" class="flex flex-col gap-4"></div>
  <p id="orders-empty" class="hidden py-16 text-center text-ink-500">Bạn chưa có đơn hàng nào. <a href="/index.html" class="text-brand-600 underline">Mua sắm ngay</a></p>
</main>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/nav.js"></script>
<script>
  if (requireLogin()) loadOrders();

  const STATUS_LABEL = {
    pending: { text: 'Chờ xử lý', color: 'bg-yellow-100 text-yellow-700' },
    processing: { text: 'Đang xử lý', color: 'bg-blue-100 text-blue-700' },
    completed: { text: 'Hoàn tất', color: 'bg-green-100 text-green-700' },
    cancelled: { text: 'Đã huỷ', color: 'bg-red-100 text-red-700' },
  };

  async function loadOrders() {
    const list = document.getElementById('orders-list');
    const emptyEl = document.getElementById('orders-empty');

    try {
      const { data } = await apiFetch('/user/orders');

      if (data.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }

      list.innerHTML = data
        .map((order) => {
          const status = STATUS_LABEL[order.status] ?? STATUS_LABEL.pending;
          return `
        <div class="rounded-2xl border border-ink-100 bg-white p-5">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
            <div>
              <p class="font-medium">Đơn hàng #${order.id}</p>
              <p class="text-xs text-ink-500">${new Date(order.created_at).toLocaleString('vi-VN')}</p>
            </div>
            <span class="rounded-full px-3 py-1 text-xs font-medium ${status.color}">${status.text}</span>
          </div>
          <div class="divide-y divide-ink-50">
            ${order.items
              .map(
                (item) => `
              <div class="flex justify-between py-2 text-sm">
                <span>${escapeHtml(item.product_name)} × ${item.quantity}</span>
                <span class="font-medium">${formatCurrency(item.price * item.quantity)}</span>
              </div>`
              )
              .join('')}
          </div>
          <div class="mt-3 flex justify-between border-t border-ink-100 pt-3 font-display font-bold">
            <span>Tổng cộng</span>
            <span class="text-brand-600">${formatCurrency(order.total_price)}</span>
          </div>
        </div>`;
        })
        .join('');
    } catch (err) {
      list.innerHTML = `<p class="py-16 text-center text-red-500">${err.message}</p>`;
    }
  }
</script>
</body>
</html>
