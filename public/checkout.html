<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanh toán — VòngMáy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['Space Grotesk', 'sans-serif'], sans: ['Inter', 'sans-serif'] },
      colors: {
        brand: { 50:'#eef3ff',100:'#dce6ff',200:'#b8ccff',300:'#8aa9ff',400:'#5c86ff',500:'#3868ff',600:'#1f5eff',700:'#1747c9',800:'#143a9e',900:'#122f7d' },
        ink: { 50:'#f7f7fb',100:'#e9eaf0',200:'#d3d5e0',300:'#b0b3c4',500:'#5b5f6b',700:'#33353d',900:'#141414' },
      },
    }},
  };
</script>
<style>body{font-family:'Inter',sans-serif;background:#F7F7FB;} .font-display{font-family:'Space Grotesk',sans-serif;}</style>
</head>
<body class="min-h-screen text-ink-900">

<div id="site-nav"></div>

<main class="mx-auto max-w-3xl px-4 py-8 sm:px-6">
  <h1 class="mb-6 font-display text-2xl font-bold sm:text-3xl">Thanh toán</h1>

  <div id="order-summary" class="mb-6 rounded-2xl border border-ink-100 bg-white p-5"></div>

  <form id="checkout-form" class="flex flex-col gap-4 rounded-2xl border border-ink-100 bg-white p-5">
    <div>
      <label class="mb-1 block text-sm font-medium">Họ tên người nhận</label>
      <input id="recipient-name" type="text" required class="w-full rounded-xl border border-ink-200 px-4 py-2.5 outline-none focus:border-brand-500" />
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium">Số điện thoại</label>
      <input id="recipient-phone" type="tel" required class="w-full rounded-xl border border-ink-200 px-4 py-2.5 outline-none focus:border-brand-500" />
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium">Địa chỉ giao hàng</label>
      <textarea id="recipient-address" required rows="3" class="w-full rounded-xl border border-ink-200 px-4 py-2.5 outline-none focus:border-brand-500"></textarea>
    </div>

    <p id="checkout-error" class="hidden text-sm font-medium text-red-500"></p>

    <button type="submit" id="submit-btn" class="mt-2 rounded-full bg-ink-900 py-3 font-medium text-white hover:bg-brand-600 disabled:cursor-not-allowed disabled:bg-ink-200">
      Đặt hàng
    </button>
  </form>
</main>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/nav.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const isBuyNow = params.get('mode') === 'buynow';

  function getCheckoutItems() {
    return isBuyNow ? buyNowItemArray() : cartItemsArray();
  }

  if (requireLogin()) {
    if (getCheckoutItems().length === 0) {
      window.location.href = isBuyNow ? '/index.html' : '/cart.html';
    }
  }

  function renderSummary() {
    const items = getCheckoutItems();
    const total = items.reduce((sum, item) => sum + item.price * item.quantity, 0);
    const summary = document.getElementById('order-summary');
    summary.innerHTML = `
      <h2 class="mb-3 font-medium text-ink-500">${isBuyNow ? 'Mua ngay' : 'Đơn hàng của bạn'}</h2>
      ${items
        .map(
          (item) => `
        <div class="flex justify-between py-1 text-sm">
          <span>${escapeHtml(item.name)} × ${item.quantity}</span>
          <span class="font-medium">${formatCurrency(item.price * item.quantity)}</span>
        </div>`
        )
        .join('')}
      <div class="mt-3 flex justify-between border-t border-ink-100 pt-3 font-display font-bold">
        <span>Tổng cộng</span>
        <span class="text-brand-600">${formatCurrency(total)}</span>
      </div>
    `;
  }

  renderSummary();

  document.getElementById('checkout-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    const errorEl = document.getElementById('checkout-error');
    errorEl.classList.add('hidden');

    const name = document.getElementById('recipient-name').value.trim();
    const phone = document.getElementById('recipient-phone').value.trim();
    const address = document.getElementById('recipient-address').value.trim();

    if (!name || !phone || !address) {
      errorEl.textContent = 'Vui lòng nhập đầy đủ họ tên, số điện thoại và địa chỉ giao hàng.';
      errorEl.classList.remove('hidden');
      return;
    }

    const sanitizedPhone = phone.replace(/\s+/g, '');
    if (!/^0\d{9,10}$/.test(sanitizedPhone)) {
      errorEl.textContent = 'Số điện thoại không hợp lệ.';
      errorEl.classList.remove('hidden');
      return;
    }

    const shippingAddress = `${name} | ${sanitizedPhone} | ${address}`;
    const items = getCheckoutItems().map((item) => ({ product_id: item.id, quantity: item.quantity }));

    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang xử lý...';

    try {
      await apiFetch('/orders', {
        method: 'POST',
        body: JSON.stringify({ items, shipping_address: shippingAddress }),
      });

      if (isBuyNow) {
        clearBuyNowItem();
      } else {
        clearCart();
      }

      window.location.href = '/orders.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đặt hàng';
    }
  });
</script>
</body>
</html>
