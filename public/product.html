<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chi tiết sản phẩm — VòngMáy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['Space Grotesk', 'sans-serif'], sans: ['Inter', 'sans-serif'] },
      colors: {
        brand: { 50:'#eef3ff',100:'#dce6ff',200:'#b8ccff',300:'#8aa9ff',400:'#5c86ff',500:'#3868ff',600:'#1f5eff',700:'#1747c9',800:'#143a9e',900:'#122f7d' },
        ink: { 50:'#f7f7fb',100:'#e9eaf0',200:'#d3d5e0',300:'#b0b3c4',500:'#5b5f6b',700:'#33353d',900:'#141414' },
      },
    }},
  };
</script>
<style>body{font-family:'Inter',sans-serif;background:#F7F7FB;} .font-display{font-family:'Space Grotesk',sans-serif;}</style>
</head>
<body class="min-h-screen text-ink-900">

<div id="site-nav"></div>

<main id="content" class="mx-auto max-w-5xl px-4 py-8 sm:px-6">
  <div class="grid animate-pulse grid-cols-1 gap-8 md:grid-cols-2">
    <div class="aspect-square rounded-2xl bg-ink-100"></div>
    <div class="space-y-4">
      <div class="h-8 w-3/4 rounded bg-ink-100"></div>
      <div class="h-5 w-1/3 rounded bg-ink-100"></div>
      <div class="h-24 w-full rounded bg-ink-100"></div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/nav.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');

  async function loadProduct() {
    const content = document.getElementById('content');
    if (!productId) {
      content.innerHTML = `<p class="py-16 text-center text-red-500">Thiếu ID sản phẩm.</p>`;
      return;
    }

    try {
      const { data: product } = await apiFetch(`/products/${productId}`);
      const outOfStock = product.stock <= 0;
      const img = product.image_url || 'https://placehold.co/600x600/eef3ff/1f5eff?text=No+Image';

      content.innerHTML = `
        <a href="/index.html" class="mb-6 inline-flex items-center gap-1 text-sm font-medium text-ink-500 hover:text-brand-600">← Về cửa hàng</a>
        <div class="grid grid-cols-1 gap-8 md:grid-cols-2">
          <div class="aspect-square overflow-hidden rounded-2xl border border-ink-100 bg-white">
            <img src="${img}" alt="${escapeHtml(product.name)}" class="h-full w-full object-cover" />
          </div>
          <div class="flex flex-col gap-4">
            <h1 class="font-display text-2xl font-bold sm:text-3xl">${escapeHtml(product.name)}</h1>
            <p class="font-display text-2xl font-bold text-brand-600">${formatCurrency(product.price)}</p>
            <p class="text-ink-500">${escapeHtml(product.description)}</p>
            <p class="text-sm ${outOfStock ? 'text-red-500' : 'text-ink-500'}">${outOfStock ? 'Hết hàng' : `Còn ${product.stock} sản phẩm trong kho`}</p>

            <div class="mt-2 flex items-center gap-3">
              <label class="text-sm font-medium">Số lượng</label>
              <div class="flex items-center rounded-full border border-ink-200">
                <button id="qty-minus" class="h-10 w-10 text-lg">−</button>
                <input id="qty-input" type="number" min="1" max="${product.stock}" value="1" class="h-10 w-14 border-x border-ink-200 text-center outline-none" />
                <button id="qty-plus" class="h-10 w-10 text-lg">+</button>
              </div>
            </div>

            <button id="add-btn" class="mt-2 rounded-full bg-ink-900 py-3 font-medium text-white transition-colors hover:bg-brand-600 disabled:cursor-not-allowed disabled:bg-ink-200" ${outOfStock ? 'disabled' : ''}>
              ${outOfStock ? 'Hết hàng' : 'Thêm vào giỏ hàng'}
            </button>
            <p id="add-feedback" class="hidden text-sm font-medium text-green-600">Đã thêm vào giỏ hàng ✓</p>
          </div>
        </div>
      `;

      const qtyInput = document.getElementById('qty-input');
      document.getElementById('qty-minus').addEventListener('click', () => {
        qtyInput.value = Math.max(1, Number(qtyInput.value) - 1);
      });
      document.getElementById('qty-plus').addEventListener('click', () => {
        qtyInput.value = Math.min(product.stock, Number(qtyInput.value) + 1);
      });

      const addBtn = document.getElementById('add-btn');
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          addToCart(product, Number(qtyInput.value));
          const feedback = document.getElementById('add-feedback');
          feedback.classList.remove('hidden');
          setTimeout(() => feedback.classList.add('hidden'), 1500);
        });
      }
    } catch (err) {
      content.innerHTML = `<p class="py-16 text-center text-red-500">${err.message}</p>`;
    }
  }

  loadProduct();
</script>
</body>
</html>
